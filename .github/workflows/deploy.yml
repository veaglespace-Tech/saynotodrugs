name: Deploy SayNoToDrugs

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test VPS port 22
        run: |
          echo "Testing connection to VPS..."
          timeout 15 bash -c "</dev/tcp/${{ secrets.VPS_HOST }}/22"
          echo "VPS port 22 is reachable from GitHub Actions"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 180s
          command_timeout: 30m
          script_stop: true
          script: |
            set -e

            echo "================================"
            echo "Starting deployment"
            echo "================================"

            cd /***/saynotodrugs

            echo "Updating source code..."
            git fetch origin main
            git reset --hard origin/main

            echo "================================"
            echo "Updating backend"
            echo "================================"

            cd server

            echo "Installing backend dependencies..."
            npm install

            echo "Generating Prisma client..."
            npx prisma generate

            echo "Updating database..."
            npx prisma db push

            echo "Restarting backend..."
            pm2 restart saynotodrugs-server

            echo "Backend deployment completed."

            echo "================================"
            echo "Updating frontend"
            echo "================================"

            cd ../client

            echo "Removing old Next.js build..."
            rm -rf .next

            echo "Installing frontend dependencies..."
            npm install
            echo "Building frontend..."
            export NODE_OPTIONS="--max_old_space_size=1024"
            export NEXT_TELEMETRY_DISABLED=1
            npm run build
            echo "Restarting frontend..."
            pm2 restart saynotodrugs-client

            echo "================================"
            echo "Deployment completed successfully"
            echo "================================"
